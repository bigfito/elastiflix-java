# Keeps the test suite self-contained. ElastiflixApplication carries
# @ConfigurationPropertiesScan, so even a @WebMvcTest slice binds
# elasticsearch.* — and application.yml resolves those from ELASTIC_HOST /
# ELASTIC_APIKEY, which would make `mvn test` fail on a machine that has not
# exported them. These values are never connected to.
elasticsearch.host=https://localhost:9200
elasticsearch.api-key=test-api-key
elasticsearch.index=elastiflix-movies
elasticsearch.ssl-verify=true
