<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — Elastiflix' : 'Elastiflix'}">Elastiflix</title>
    <!-- Both assets are served from /static: no CDN, and nothing inline. That is what lets the
         CSP be plain `script-src 'self'` / `style-src 'self'`, and it means the page is styled
         offline. See src/main/resources/static/css/elastiflix.css. -->
    <link rel="stylesheet" th:href="@{/css/elastiflix.css}" href="/css/elastiflix.css"/>
    <script th:src="@{/js/elastiflix.js}" src="/js/elastiflix.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

<nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center gap-6">
    <a href="/" class="text-brand font-bold text-2xl tracking-tight">Elastiflix</a>
    <span class="text-gray-500 text-sm hidden sm:block">Powered by Elasticsearch</span>
</nav>

<main class="flex-1">
    <th:block th:replace="${content}"/>
</main>

<footer class="bg-gray-900 border-t border-gray-800 text-center text-gray-600 text-xs py-4">
    Elastiflix &copy; <span th:text="${currentYear}">2026</span> &mdash; Elasticsearch-powered movie search
</footer>

</body>
</html>
